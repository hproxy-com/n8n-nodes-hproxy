# Publishes @hproxy/n8n-nodes-hproxy to npm, with an npm provenance statement, when a version
# tag such as 0.1.0 is pushed.
#
# n8n verifies community nodes only when they are published from GitHub Actions with
# provenance (required since May 1, 2026). Provenance lets anyone check that this workflow
# built the package from this repository at the tagged commit. This file follows the publish
# workflow of n8n's node starter and adds: actions pinned to commit SHAs, checkout without a
# stored token, installs without dependency scripts, the tests before the release, and a check
# that the tag matches the version in package.json.
#
# ONE-TIME SETUP
#   Option A, npm trusted publishing (no secret in GitHub):
#     npmjs.com > the package > Settings > Trusted Publisher > GitHub Actions:
#       Organization or user: hproxy-com
#       Repository:           n8n-nodes-hproxy
#       Workflow filename:    publish.yml
#       Environment:          (empty)
#     Leave the NPM_TOKEN secret unset.
#   Option B, a token: an npm granular access token with read and write access to this one
#     package, stored as the NPM_TOKEN secret of this repository.
#
# RELEASING
#   1. Set the new version in package.json and package-lock.json and add it to CHANGELOG.md.
#   2. Commit, then tag the commit with the bare version (git tag 0.1.0) and push the tag.
#   `npm run release` run locally does the same through release-it.

name: Publish

on:
  push:
    tags:
      - '*.*.*'

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Mints the OIDC token for the provenance statement and for trusted publishing.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match version $version in package.json."
            exit 1
          fi

      - name: Check that npm can use trusted publishing
        run: |
          npm_version="$(npm --version)"
          if ! node -e "const [a,b,c]=process.argv[1].split('.').map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)" "$npm_version"; then
            echo "npm $npm_version is older than 11.5.1, the first release with trusted publishing."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test

      - name: Release
        # n8n-node release sees GITHUB_ACTIONS, runs lint and build, then npm publish with
        # NPM_CONFIG_PROVENANCE=true. Option A: NPM_TOKEN stays unset and npm uses OIDC.
        # Option B: the token is written to the npm config for this run only.
        run: |
          [ -n "$NPM_TOKEN" ] && npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          npm run release
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
